# One origin for everything the browser talks to: the app, the sync backend
# and Supabase. That way tailscale serve needs a single HTTPS port and there
# is no CORS or mixed-content to get wrong.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A first sync walks the whole Garmin history, one request per activity.
    location /api/ {
        proxy_pass http://backend:8788;
        proxy_read_timeout 1h;
    }

    # Supabase's API gateway (Kong), reached over the Supabase CLI's network.
    location ~ ^/(auth|rest|realtime|storage|functions|graphql)/v1/ {
        proxy_pass http://supabase_kong_Walkies:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }
}
